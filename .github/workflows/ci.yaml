# Seeded once by `limen fix`, then the project's own but for one line: the
# `uses:` reference below, which calls the shared lanes (verify on every
# platform, fuzz, race, tools) in limen-verify.yaml at a commit of
# farcloser/limen, set by `limen fix` when it writes the file and moved by
# Renovate with the limen pin (limen itself calls the file locally). This file
# adds the project's own jobs and gates on all of them.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# No default token permissions: each job states what it needs. This workflow
# only ever reads the repository — it cannot write code, releases, or
# packages even if a step is compromised.
permissions: {}

# A superseded run (new push to the same branch/PR) is cancelled, not raced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  limen:
    uses: farcloser/limen/.github/workflows/limen-verify.yaml@558f7ae692e9df0c5055e9ac2d1d6c66172544f3 # v0.31.0
    permissions:
      contents: read
      # A project that needs another runner set, or whose tests read fixtures
      # from a git submodule, passes it here, e.g.
      # with:
      #   os: '["ubuntu-24.04", "macos-15"]'
      #   submodules: recursive

  # The watcher as a container's first process: its tests start the program
  # as number 1 of a new namespace of processes, which a hosted runner lets
  # root alone make. In the shared lanes they skip; here they run, and a skip
  # fails the job.
  first-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic

      - run: just test-first-process

  # The ONE required status check (defaultRequiredChecks in
  # internal/github/audit.go). Requiring the lanes by name would bake the
  # runner list into every ruleset; this job collapses them to one stable
  # name. A project job joins `needs` and the assertion below.
  gate:
    needs: [limen, first-process]
    # always(), and the result asserted explicitly. Without always() a failed
    # or cancelled dependency SKIPS this job instead of failing it, and a
    # skipped required check does not block a merge — branch protection that
    # quietly stops protecting. `needs.limen.result` is success only when
    # every lane it ran succeeded: each verify leg, fuzz, race and tools.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every lane succeeded
        env:
          # Via env, never interpolated into the script: the shell sees data,
          # not something the expression layer can rewrite into code.
          RESULT: ${{ needs.limen.result }}
          FIRST: ${{ needs.first-process.result }}
        shell: bash
        run: |
          printf 'limen: %s\nfirst-process: %s\n' "$RESULT" "$FIRST"
          [ "$RESULT" = "success" ] && [ "$FIRST" = "success" ]
